    <!-- JSON-LD Structured Data for Person Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Dhamotharan Samy",
      "jobTitle": "Entry-Level Software Developer",
      "email": "mailto:dhamotharanpers@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Chennai",
        "addressCountry": "India"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Manonmaniyam Sundaranar University"
      },
      "knowsAbout": [
        "Python",
        "Django",
        "Django REST Framework",
        "React",
        "TypeScript",
        "JavaScript",
        "SQL",
        "Tailwind CSS",
        "Three.js"
      ],
      "sameAs": [
        "https://github.com/dhamugit05",
        "https://www.linkedin.com/in/dhamotharansamy-"
      ]
    }
    </script>

    <!-- Theme inline script to prevent flash of unstyled theme -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('portfolio-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark) || !storedTheme) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F7F8FC] dark:bg-[#05060A] text-slate-900 dark:text-slate-100 selection:bg-cyan-400 selection:text-black overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
